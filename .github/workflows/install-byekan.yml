name: Install BYekan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-byekan.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and register BYekan
        shell: bash
        run: |
          set -euo pipefail
          base64 -d public/assets/fonts/BYekan.woff2.b64 > public/assets/fonts/BYekan.woff2
          python3 - <<'PY'
          from pathlib import Path

          css = Path('public/assets/css/app.css')
          text = css.read_text(encoding='utf-8')
          lines = text.splitlines()
          lines[0] = '@font-face{font-family:"BYekan";src:url("../fonts/BYekan.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}'
          css.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm -f public/assets/fonts/BYekan.woff2.b64
          rm -f public/assets/css/byekan.css
          rm -f .github/workflows/install-byekan.yml

      - name: Commit webfont
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: self-host BYekan webfont"
          git push origin HEAD:main
